<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="360" viewBox="0 0 1050 360">
  <rect width="1050" height="360" rx="24" fill="#111827"/>
  <text x="55" y="55" fill="#f3f4f6" font-family="Arial" font-size="28" font-weight="700">Arquitetura integrada</text>
  <g font-family="Arial" font-size="19" text-anchor="middle">
    <rect x="65" y="115" width="230" height="120" rx="18" fill="#7c3aed"/><text x="180" y="160" fill="#ede9fe">Streamlit</text><text x="180" y="193" fill="#ddd6fe">Interface + fallback</text>
    <rect x="410" y="115" width="230" height="120" rx="18" fill="#0369a1"/><text x="525" y="160" fill="#e0f2fe">FastAPI</text><text x="525" y="193" fill="#bae6fd">REST + validação</text>
    <rect x="755" y="115" width="230" height="120" rx="18" fill="#166534"/><text x="870" y="160" fill="#dcfce7">SQLite</text><text x="870" y="193" fill="#bbf7d0">Dados persistidos</text>
