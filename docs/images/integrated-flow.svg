  <g stroke="#cbd5e1" stroke-width="4" fill="none"><path d="M295 155h115" marker-end="url(#arrow)"/><path d="M640 175h115" marker-end="url(#arrow)"/><path d="M755 205H640" stroke-dasharray="10 8" marker-end="url(#arrow)"/></g>
  <text x="525" y="290" fill="#94a3b8" font-family="Arial" font-size="17" text-anchor="middle">O cliente tenta a API e usa o banco local quando ela está indisponível</text>
